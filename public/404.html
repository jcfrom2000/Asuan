<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>OverStream Therapy - Redirecting...</title>
    <script type="text/javascript">
      // Single Page Apps for GitHub Pages Redirect Handling
      // Converts 404 direct subpath request into root index query parameter redirect
      var knownFirstSegments = [
        'zh', 'contact', 'about', 'about-jessica', 'faq', 'faqs',
        'community', 'community-services', 'community-workshops', 'workshops', 'groups',
        'solution-focused-coaching', 'coaching', 'immigration-evaluation',
        'sex-therapy', 'sex-intimacy-therapy', 'individual-therapy', 'individual-counseling',
        'couple-family-therapy', 'couple-and-family-therapy', 'consultation-supervision', 'supervision', 'home'
      ];

      var l = window.location;
      var pathSegments = l.pathname.split('/').filter(Boolean);

      // Determine pathSegmentsToKeep dynamically (1 if under subpath repository like /Asuan/, 0 if root domain)
      var pathSegmentsToKeep = 0;
      if (pathSegments.length > 0 && !knownFirstSegments.includes(pathSegments[0])) {
        pathSegmentsToKeep = 1;
      }

      var basePath = l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/';
      var routePath = l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~');
      var queryString = l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '';

      var redirectUrl = l.protocol + '//' + l.host + basePath + '?' + '/' + routePath + queryString + l.hash;

      l.replace(redirectUrl);
    </script>
  </head>
  <body>
  </body>
</html>
